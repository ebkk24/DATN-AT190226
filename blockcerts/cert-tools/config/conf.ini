# Đường dẫn dữ liệu tính từ /workspace trong container
data_dir = .

# Hồ sơ tổ chức phát hành
issuer_url = https://actvn.edu.vn/
issuer_id = http://ebk.tailc30db9.ts.net:8088/api/blockcerts/issuers/kma/profile.json

# Mẫu chứng thư
template_dir = certificate_templates
template_file_name = diploma-v3.json

# Danh sách người nhận và thư mục kết quả
roster = rosters/roster-demo.csv
unsigned_certificates_dir = unsigned_certificates
filename_format = uuid
no_clobber = true

# Nội dung chung của văn bằng
additional_global_fields = {"fields":[{"path":"$.@context","value":["https://www.w3.org/2018/credentials/v1",{"alumniOf":"https://schema.org/alumniOf"},"https://w3id.org/blockcerts/v3"]},{"path":"$.name","value":"Văn bằng tốt nghiệp"},{"path":"$.description","value":"Văn bằng điện tử được phát hành và neo bằng Blockcerts trên mạng Bitcoin regtest."},{"path":"$.display","value":{"contentMediaType":"text/html","content":"<section><h1>Văn bằng tốt nghiệp</h1><p>Học viện Kỹ thuật Mật mã</p></section>"}}]}

# Trường riêng của từng người nhận
additional_per_recipient_fields = {"fields":[{"path":"$.credentialSubject.name","value":"*|RECIPIENT_NAME|*","csv_column":"recipient_name"},{"path":"$.nonce","value":"*|NONCE|*","csv_column":"nonce"}]}
