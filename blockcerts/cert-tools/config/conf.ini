# Đường dẫn dữ liệu tính từ /workspace trong container
data_dir = .

# Hồ sơ tổ chức phát hành
issuer_url = https://actvn.edu.vn/
issuer_id = http://100.105.56.19:8088/api/blockcerts/issuers/kma/profile.json

# Mẫu chứng thư
template_dir = certificate_templates
template_file_name = diploma-v3.json

# Danh sách người nhận và thư mục kết quả
roster = rosters/roster-demo.csv
unsigned_certificates_dir = unsigned_certificates
filename_format = uuid
no_clobber = true

# Nội dung chung của văn bằng
additional_global_fields = {"fields":[{"path":"$.@context","value":["https://www.w3.org/2018/credentials/v1",{"alumniOf":"https://schema.org/alumniOf","studentCode":"https://schema.org/identifier","dateOfBirth":"https://schema.org/birthDate","email":"https://schema.org/email","cohort":"https://actvn.edu.vn/credentials/terms#cohort","degreeName":"https://schema.org/educationalCredentialAwarded","major":"https://actvn.edu.vn/credentials/terms#major","educationLevel":"https://schema.org/educationalLevel","graduationRank":"https://schema.org/award","graduationYear":"https://schema.org/endDate","issueDate":"https://schema.org/dateIssued","diplomaNumber":"https://schema.org/serialNumber","trainingMode":"https://schema.org/courseMode"},"https://w3id.org/blockcerts/v3"]},{"path":"$.name","value":"Văn bằng tốt nghiệp"},{"path":"$.description","value":"Văn bằng điện tử được phát hành và neo bằng Blockcerts trên mạng Bitcoin regtest."},{"path":"$.display","value":{"contentMediaType":"text/html","content":"<section><h1>Văn bằng tốt nghiệp</h1><p>Học viện Kỹ thuật Mật mã</p></section>"}}]}

# Trường riêng của từng người nhận
additional_per_recipient_fields = {"fields":[{"path":"$.credentialSubject.name","value":"*|RECIPIENT_NAME|*","csv_column":"recipient_name"},{"path":"$.credentialSubject.studentCode","value":"*|STUDENT_CODE|*","csv_column":"student_code"},{"path":"$.credentialSubject.dateOfBirth","value":"*|DATE_OF_BIRTH|*","csv_column":"date_of_birth"},{"path":"$.credentialSubject.email","value":"*|EMAIL|*","csv_column":"email"},{"path":"$.credentialSubject.cohort","value":"*|COHORT|*","csv_column":"cohort"},{"path":"$.credentialSubject.degreeName","value":"*|DEGREE_NAME|*","csv_column":"degree_name"},{"path":"$.credentialSubject.major","value":"*|MAJOR|*","csv_column":"major"},{"path":"$.credentialSubject.educationLevel","value":"*|EDUCATION_LEVEL|*","csv_column":"education_level"},{"path":"$.credentialSubject.graduationRank","value":"*|GRADUATION_RANK|*","csv_column":"graduation_rank"},{"path":"$.credentialSubject.graduationYear","value":"*|GRADUATION_YEAR|*","csv_column":"graduation_year"},{"path":"$.credentialSubject.issueDate","value":"*|ISSUE_DATE|*","csv_column":"issue_date"},{"path":"$.credentialSubject.diplomaNumber","value":"*|DIPLOMA_NUMBER|*","csv_column":"diploma_number"},{"path":"$.credentialSubject.trainingMode","value":"*|TRAINING_MODE|*","csv_column":"training_mode"},{"path":"$.nonce","value":"*|NONCE|*","csv_column":"nonce"}]}
