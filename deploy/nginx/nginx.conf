worker_processes  1;
pid /home/khai/DATN_work/datn-blockcerts/deploy/runtime/nginx.pid;
error_log /home/khai/DATN_work/datn-blockcerts/deploy/logs/nginx-error.log warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /home/khai/DATN_work/datn-blockcerts/deploy/logs/nginx-access.log main;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 10m;
  client_body_buffer_size 1m;
  client_body_temp_path /home/khai/DATN_work/datn-blockcerts/deploy/runtime/client_body 1 2;
  proxy_temp_path /home/khai/DATN_work/datn-blockcerts/deploy/runtime/proxy_temp 1 2;

  map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  server {
    listen 127.0.0.1:8088;
    listen 0.0.0.0:8088;
    server_name _;
    root /srv/datn-blockcerts/deploy/www;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = / { return 302 /verify/; }
    location = /student { return 301 /student/; }
    location = /admin { return 301 /admin/; }
    location = /verify { return 301 /verify/; }

    location /student/ { try_files $uri $uri/ /student/index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /verify/ { try_files $uri $uri/ /verify/index.html; }

    location ~ ^/(api|health|docs)(/|$) {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $upstream_proto;
      proxy_read_timeout 300s;
    }

    location ~ /\. { deny all; }
  }
}
